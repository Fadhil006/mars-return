# Keeps the free Render instance awake during judging: Render sleeps a free web service after about 15 minutes
# without traffic. Set the repository variable RENDER_URL (Settings > Secrets and variables > Actions > Variables),
# e.g. https://mars-return.onrender.com. GitHub runs scheduled jobs on a best-effort basis, so runs can be late.
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the region endpoint
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then echo "RENDER_URL is not set; nothing to ping."; exit 0; fi
          # A cold start can take close to a minute, so allow 90 s.
          curl --fail --silent --show-error --max-time 90 --retry 2 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" "$RENDER_URL/api/region"
